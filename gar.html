<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
   <style>
     *{
        margin: 0;
        padding: 0;
     }
     .padding{
        height: 50px;
        width: 50px;
        padding: 2px;

     }
     #first{
        margin: 5px 5px 25px 5px;
        background-color: rgb(65, 16, 240);
     }
     #second{
        margin: 50px 5px 25px 5px;
        background-color: rgb(247, 23, 23);

     }
   </style>
</head>
<body>
<div id="first" class="padding">first</div>
<div id="second" class="padding">second</div>
</body>
</html>
